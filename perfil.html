<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos - Perfil</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos+In&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <h1>Chronos</h1>
        <nav>
            <ul>
                <li><a href="index.html">+ Agregar</a></li>
                <li><a href="listas.html">Mi Lista</a></li>
                <li><a href="perfil.html">Perfil</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="perfil-section">
            <div class="perfil-header">
                <div class="avatar-container">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <h2>Josh</h2>
                <p class="bio">...</p>
            </div>

            <div class="estadisticas-grid">
                <div class="stat-card">
                    <span class="stat-number">1</span>
                    <span class="stat-label">Películas</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">1</span>
                    <span class="stat-label">Series</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">1</span>
                    <span class="stat-label">Libros</span>
                </div>
            </div>

            <div class="perfil-info">
                <h3>Información de la Cuenta</h3>
                <div class="info-item">
                    <label>Nombre de Usuario:</label>
                    <span>Josh</span>
                </div>
                <div class="info-item">
                    <label>Correo:</label>
                    <span>josh@ejemplo.com</span>
                </div>
                <button type="submit" class="btn-edit-perfil">Editar Perfil</button>
            </div>
        </section>
    </main>


</body>
</html>
